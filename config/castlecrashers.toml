# XenonRecomp configuration for Castle Crashers (title 584108B7, title update 2).
# Paths are relative to this file. The XEX is the user's own package's, with
# the title update applied (tools/build.py).
[main]
file_path = "../build/default.xex"
out_directory_path = "../build/ppc"
switch_table_file_path = "castlecrashers_switch_tables.toml"

skip_lr = true
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
# r0, r2, r11, r12, r14-r31, f0 and f14-f31 are locals of each function, so
# the compiler can keep them in the processor's registers (the calls to the
# save and restore helpers go). The functions listed in
# context_register_functions keep them in the context: they read one their
# caller set (the compiler's __finally funclets use their parent's frame,
# some helpers take r12), or call one that does (tools/context_functions.py).
non_argument_as_local = true
non_volatile_as_local = true
# The vector registers stay in the context (__savevmx_* and __restvmx_* are
# still called): partial writes make the scan unreliable for them, and the
# Pentium III gains little.
vector_as_local = false

restgprlr_14_address = 0x8218B5A0
savegprlr_14_address = 0x8218B550
restfpr_14_address = 0x8218C36C
savefpr_14_address = 0x8218C320
